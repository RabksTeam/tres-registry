name: Build Official Catalog on Approval (Merge)

on:
  push:
    branches:
      - main
    paths:
      - 'submissions/*.json'

permissions:
  contents: write

jobs:
  build-catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Merge Approved Submissions into catalog.json
        run: |
          python3 - << 'EOF'
          import json, glob, os
          from datetime import datetime, timezone

          catalog_path = 'catalog.json'
          catalog = json.load(open(catalog_path, 'r', encoding='utf-8')) if os.path.exists(catalog_path) else {"name": "متجر ترس الرسمي", "version": 1, "items": []}
          items_by_id = {item['id']: item for item in catalog.get('items', [])}

          for path in sorted(glob.glob('submissions/*.json')):
              if os.path.basename(path).startswith('_'):
                  continue
              sub = json.load(open(path, 'r', encoding='utf-8'))
              sub['status'] = 'published'
              sub['verified_source'] = True
              for v in sub.get('versions', []):
                  v.setdefault('date_published', datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ'))
              items_by_id[sub['id']] = sub

          catalog['updated_at'] = datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')
          catalog['items'] = list(items_by_id.values())
          json.dump(catalog, open(catalog_path, 'w', encoding='utf-8'), ensure_ascii=False, indent=2)
          EOF

      - name: Commit & Push Updated catalog.json
        run: |
          git config user.name "Tres Registry Bot"
          git config user.email "bot@tres-launcher.local"
          git add catalog.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: publish approved submissions" && git push)
